[project]
name = "oem-mcp"
version = "1.0.4"
description = "Monorepo for OpenEmpiric OEM MCP workspace"
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
    "packages/*",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
markers = ["periodic_eval: opt-in cached real-model evaluation"]
