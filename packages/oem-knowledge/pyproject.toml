[project]
name = "oem-knowledge"
version = "1.0.4"
description = "Local-first hybrid RAG knowledge layer — concept registry, knowledge events, vector search, and OEM bootstrapper"
requires-python = ">=3.12"
dependencies = [
    "debugpy>=1.8",
    "fastmcp>=3.2",
    "pathspec",
    "pyyaml",
]

[project.optional-dependencies]
semantic = [
    "fastembed",
]

[project.scripts]
oem = "oem_knowledge.cli:main"
oem-debug = "oem_knowledge.debug:main"
oem-debug-server = "oem_knowledge.debug:server"

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oem_knowledge = [
    "plugins/openempiric.ts",
    "plugins/generated/schemas.ts"
]
