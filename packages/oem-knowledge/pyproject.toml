[project]
name = "oem-knowledge"
version = "0.1.0"
description = "Local-first hybrid RAG knowledge layer — concept registry, knowledge events, vector search, and OEM bootstrapper"
requires-python = ">=3.12"
dependencies = [
    "chromadb",
    "fastembed",
    "watchdog",
    "oem-tui",
    "fastmcp>=3.2",
]

[project.scripts]
oem = "oem_knowledge.cli:main"

[tool.uv]
dev-dependencies = ["pytest>=8"]

[tool.uv.sources]
oem-tui = { path = "../oem-tui" }
