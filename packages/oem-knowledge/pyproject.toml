[project]
name = "oem-knowledge"
version = "0.9.5"
description = "Local-first hybrid RAG knowledge layer — concept registry, knowledge events, vector search, and OEM bootstrapper"
requires-python = ">=3.12"
dependencies = [
    "chromadb",
    "fastembed",
    "watchdog",
    "oem-tui",
    "fastmcp>=3.2",
]

[project.scripts]
oem = "oem_knowledge.cli:main"

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
oem-tui = { workspace = true }

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
oem_knowledge = ["plugins/openempiric.ts"]
