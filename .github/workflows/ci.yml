name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for nested virtualenvs
        run: |
          if find packages -name ".venv" | grep .; then
            echo "Nested .venv detected in packages directory!"
            exit 1
          else
            echo "No nested virtualenvs detected."
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --dev

      - name: Validate Python Compilation (Syntax Check)
        run: uv run python -m compileall -q -f packages/

      - name: Run OEM Custom Linter
        run: uv run oem lint

      - name: Run Tests
        run: uv run pytest
